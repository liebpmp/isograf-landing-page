<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isograf — Der einfache Weg zu deiner Zertifizierung</title>
    <meta name="description" content="Wir strukturieren, optimieren und zertifizieren Ihr Unternehmen – mit der Erfahrung aus über 1.000 Projekten. 100% Erfolgsgarantie.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            background: #FFFFFF;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* SVG container — renders the Figma design 1:1 */
        .svg-container {
            width: 100%;
            max-width: 1441px;
            line-height: 0;
        }

        .svg-container object {
            width: 100%;
            height: auto;
        }

        /* For screens wider than design, center with white sides */
        @media (min-width: 1442px) {
            body { background: #F5F5F5; }
            .svg-container { 
                box-shadow: 0 0 60px rgba(0,0,0,0.08);
            }
        }
    </style>
</head>
<body>
    <div class="svg-container">
        <object data="isograf-externalized.svg" type="image/svg+xml" width="100%">
            <!-- Fallback for browsers that can't render SVG -->
            <img src="isograf-main-design.png" alt="Isograf Landing Page" style="width:100%;height:auto;">
        </object>
    </div>
</body>
</html>
